<style>
:root{--azul:#0B63CE;--azul-esc:#084EA3;--verde:#6CBF3A;--verde-esc:#57A028;--txt:#0F172A;--cinza:#64748B;--cinza2:#475569;--linha:#E5E7EB;--bg:#F8FAFC}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:'Inter',system-ui,sans-serif;font-size:15px}
a{color:var(--azul)}a:hover{color:var(--azul-esc)}
button,input,select{font-family:inherit;font-size:14px}
h1,h2,.num{font-family:'Poppins',sans-serif}
h1{margin:0;font-size:26px;font-weight:700}
h2{margin:0;font-size:18px;font-weight:600}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.load{min-height:100vh;display:grid;place-items:center;color:var(--cinza)}
.wrap{display:flex;flex-wrap:wrap;align-items:flex-start;min-height:100vh}
.side{flex:1 1 220px;max-width:100%;align-self:stretch;background:#fff;border-right:1px solid var(--linha);padding:24px 18px;display:flex;flex-direction:column;gap:22px}
.side img{width:120px}
.side nav{display:flex;flex-direction:column;gap:4px}
.side nav a{padding:11px 14px;border-radius:10px;color:#334155;text-decoration:none;font-size:14px}
.side nav a:hover{background:#F1F5F9}
.me{margin-top:auto;padding:14px;border-radius:12px;background:#F1F5F9;font-size:13px;color:var(--cinza2);line-height:1.5;word-break:break-word}
.me strong{display:block;color:var(--txt);font-weight:600}
.main{flex:999 1 560px;min-width:0;padding:28px clamp(16px,3vw,40px) 48px;display:flex;flex-direction:column;gap:24px}
.top{background:#fff;border-bottom:1px solid var(--linha)}
.top>div{max-width:1180px;margin:0 auto;padding:14px clamp(16px,3vw,32px);display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.top img{width:104px}
.top .who{display:flex;align-items:center;gap:14px;font-size:13.5px;color:var(--cinza2)}
.page{max-width:1180px;margin:0 auto;padding:28px clamp(16px,3vw,32px) 48px;display:flex;flex-direction:column;gap:22px}
.eyebrow{margin:0 0 4px;font-size:13px;color:var(--cinza)}
.head{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{min-height:44px;padding:0 18px;border-radius:10px;border:0;background:var(--azul);color:#fff;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.btn:hover{background:var(--azul-esc);color:#fff}
.btn.out{background:#fff;color:var(--azul);border:1.5px solid var(--azul)}
.btn.out:hover{background:#EAF2FC}
.btn.gray{background:#fff;color:#334155;border:1px solid #CBD5E1}
.btn.green{background:var(--verde)}.btn.green:hover{background:var(--verde-esc)}
.btn:disabled{opacity:.6;cursor:wait}
.mini{min-height:36px;padding:0 12px;border-radius:8px;border:1px solid #CBD5E1;background:#fff;color:#334155;font-size:13px;font-weight:600;cursor:pointer}
.mini.red{border-color:#FCA5A5;color:#B91C1C}
.mini.warn{background:#B91C1C;border-color:#B91C1C;color:#fff}
.linkbtn{background:none;border:0;padding:0;color:var(--azul);font-weight:600;cursor:pointer;font-size:13.5px;text-align:left}
.card{background:#fff;border:1px solid var(--linha);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.kpi{background:#fff;border:1px solid var(--linha);border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.kpi span{font-size:13px;color:var(--cinza)}
.kpi .num{font-size:26px;font-weight:700}
.kpi small{font-size:12.5px;color:var(--cinza2)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{min-height:40px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;background:#fff;color:#334155;border:1px solid #CBD5E1}
.pill[aria-pressed="true"]{background:var(--azul);color:#fff;border-color:var(--azul)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--cinza2);font-size:12.5px;font-weight:600;padding:10px 12px;border-bottom:1px solid var(--linha);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid #F1F5F9;vertical-align:middle}
td.b{font-weight:600}td.m{color:var(--cinza2)}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.b-ok{background:#E8F5E0;color:#2F6B12}.b-wait{background:#FEF3C7;color:#92400E}.b-bad{background:#FEE2E2;color:#991B1B}.b-off{background:#E5E7EB;color:#374151}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:20px;align-items:start}
.bar{height:10px;border-radius:6px;background:#EEF2F7}.bar i{display:block;height:10px;border-radius:6px;background:var(--azul)}
.reg{display:flex;flex-direction:column;gap:6px}.reg div:first-child{display:flex;justify-content:space-between;gap:10px;font-size:14px}.reg span+span{color:var(--cinza2)}
.chart{display:flex;align-items:flex-end;gap:12px;height:210px;padding-top:8px;border-bottom:1px solid var(--linha)}
.chart>div{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.chart small{font-size:11px;color:var(--cinza2);white-space:nowrap}
.chart i{display:block;width:100%;max-width:56px;border-radius:8px 8px 0 0;background:#9CC3EE;min-height:2px}
.chart>div:last-child i{background:var(--azul)}
.months{display:flex;gap:12px}.months span{flex:1 1 0;text-align:center;font-size:12.5px;color:var(--cinza)}
.boxes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.box{background:var(--bg);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.box span{font-size:12.5px;color:var(--cinza)}.box strong{font-size:17px;font-weight:600}
.box.line{background:#fff;border:1px solid var(--linha)}
.form{border:1px solid #DCE7F2;background:#F8FBFF;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#334155}
label.f input,label.f select{min-height:44px;padding:0 12px;border:1px solid #CBD5E1;border-radius:10px;background:#fff;font-weight:400}
label.c{display:flex;align-items:center;gap:8px;font-size:14px;min-height:44px}
label.c input{width:18px;height:18px}
.note{margin:0;font-size:13px;color:var(--cinza)}
.msg{font-size:13.5px;padding:10px 12px;border-radius:10px;display:none}
.msg.on{display:block}.msg.err{background:#FEE2E2;color:#991B1B}.msg.ok{background:#E8F5E0;color:#2F6B12}
.cardz{flex:1 1 340px;max-width:460px;aspect-ratio:1.6/1;min-height:220px;border-radius:20px;padding:22px 24px;background:var(--azul);color:#fff;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 14px 34px rgba(11,99,206,.28);position:relative;overflow:hidden}
.cardz:before{content:'';position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.08)}
.cardz:after{content:'';position:absolute;right:40px;bottom:-90px;width:200px;height:200px;border-radius:50%;background:rgba(108,191,58,.25)}
.cardz>*{position:relative;z-index:1}
.cardz .t{font-family:'Poppins',sans-serif;font-size:20px;font-weight:700}
.cardz .s{font-size:12.5px;opacity:.9}
.cardz .n{font-family:'Poppins',sans-serif;font-size:19px;font-weight:600;text-transform:uppercase}
.cardz .meta{display:flex;gap:24px;flex-wrap:wrap;font-size:12.5px}.cardz .meta div div:first-child{opacity:.8}.cardz .meta div div+div{font-weight:600}
.cardz .on{position:absolute;top:22px;right:24px;padding:4px 10px;border-radius:999px;background:#fff;color:#2F6B12;font-size:12px;font-weight:700}
.atalhos{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.atalhos a,.atalhos button{min-height:52px;display:flex;align-items:center;gap:10px;padding:0 14px;border-radius:12px;font-weight:600;font-size:14px;text-decoration:none;border:0;cursor:pointer;text-align:left}
.dl{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid #F1F5F9;font-size:14px}.dl span:first-child{color:var(--cinza)}.dl span+span{font-weight:500;text-align:right;word-break:break-word}
.tag{padding:6px 12px;border-radius:999px;background:#EAF2FC;color:var(--azul);font-size:13px;font-weight:600}
.dep{border:1px solid var(--linha);border-radius:12px;padding:12px 14px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px}
.dep small{display:block;font-size:12.5px;color:var(--cinza)}
.flex{display:flex;flex-wrap:wrap;gap:20px;align-items:stretch}
.pay{display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between}
.empty{color:var(--cinza);font-size:14px;padding:6px 0}
@media (max-width:640px){.side{border-right:0;border-bottom:1px solid var(--linha)}.me{margin-top:0}}
</style>
</head>
<body>
<div id="app"><div class="load">Carregando…</div></div>
<script>
(function(){
'use strict';
var API = 'https://script.google.com/macros/s/AKfycbyi9OkzuqHJ5NsLBtOaC8-NTS1B18OLM2O9ND3SWrlQPILJpYQ2jAQ2MBlKvG2q4Q3l/exec';
var LOGO = 'logo.png';
var NOMES = { gestor: 'Gestor', empresa: 'Empresa', cliente: 'Cliente', financeiro: 'Financeiro' };
var app = document.getElementById('app');
var S = null; try { S = JSON.parse(sessionStorage.getItem('vivaSessao') || 'null'); } catch(e){}
if(!S || !S.token){ location.replace('/#acesso'); return; }

function api(dados){
  dados.token = S.token;
  return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(dados) })
    .then(function(r){ return r.json(); })
    .catch(function(){ return { ok: false, erro: 'Sem conexão no momento. Tente novamente.' }; })
    .then(function(r){ if(r && r.sessao === false) sairLocal(r.erro); return r || { ok: false }; });
}
function sairLocal(motivo){
  try { sessionStorage.removeItem('vivaSessao'); } catch(e){}
  if(motivo) alertaTopo(motivo);
  location.replace('/#acesso/' + (S && S.perfil ? S.perfil : ''));
}
function sair(){ api({ api: 'sair' }).then(function(){ sairLocal(); }); }
function alertaTopo(t){ app.textContent = ''; app.appendChild(el('div', { class: 'load' }, t)); }

// cria elementos com texto SEMPRE como texto (nunca HTML)
function el(tag, at){
  var e = document.createElement(tag);
  if(at) Object.keys(at).forEach(function(k){
    var v = at[k]; if(v == null || v === false) return;
    if(k === 'on') Object.keys(v).forEach(function(ev){ e.addEventListener(ev, v[ev]); });
    else if(k === 'style') e.style.cssText = v;
    else e.setAttribute(k, v === true ? '' : v);
  });
  for(var i = 2; i < arguments.length; i++) add(e, arguments[i]);
  return e;
}
function add(e, c){ if(c == null || c === false) return; if(Array.isArray(c)) c.forEach(function(x){ add(e, x); }); else e.appendChild(c.nodeType ? c : document.createTextNode(String(c))); }
function brl(n){ return 'R$ ' + Number(n || 0).toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
function milhar(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
function seguro(u){ return /^https:\/\/([a-z0-9-]+\.)*asaas\.com\//i.test(String(u || '')) ? u : null; }
function badge(t){
  var k = /^(Pago|Ativo)/.test(t) ? 'b-ok' : /^(Aguardando|Em aberto)/.test(t) ? 'b-wait' : /^(Vencido|Cancelado|Estornado|Excluído)/.test(t) ? 'b-bad' : 'b-off';
  return el('span', { class: 'badge ' + k }, t);
}
function kpi(r, v, d){ return el('div', { class: 'kpi' }, el('span', null, r), el('strong', { class: 'num' }, v), d ? el('small', null, d) : null); }
function tabela(cols, linhas, minW){
  return el('div', { class: 'tbl' }, el('table', { style: 'min-width:' + (minW || 600) + 'px' },
    el('thead', null, el('tr', null, cols.map(function(c){ return el('th', null, c); }))),
    el('tbody', null, linhas.length ? linhas : el('tr', null, el('td', { colspan: cols.length, class: 'm' }, 'Nada por aqui ainda.')))));
}
function td(v, cls){ return el('td', cls ? { class: cls } : null, v); }
function msgBox(){ return el('div', { class: 'msg', role: 'status' }); }
function msg(box, tipo, t){ box.className = 'msg on ' + tipo; box.textContent = t; }
function campo(rot, at){ return el('label', { class: 'f' }, rot, el('input', at)); }
function selectF(rot, opts, at){ return el('label', { class: 'f' }, rot, el('select', at, opts.map(function(o){ return el('option', { value: o[0] }, o[1]); }))); }
function pills(lista, atual, onPick, rot){
  return el('div', { class: 'pills', role: 'group', 'aria-label': rot }, lista.map(function(o){
    return el('button', { type: 'button', class: 'pill', 'aria-pressed': String(o[0] === atual), on: { click: function(){ onPick(o[0]); } } }, o[1]);
  }));
}
function ocupado(btn, on, txt){ if(on){ btn.dataset.t = btn.textContent; btn.textContent = txt || 'Aguarde…'; btn.disabled = true; } else { btn.textContent = btn.dataset.t; btn.disabled = false; } }
function topo(nomeLinha){
  return el('header', { class: 'top' }, el('div', null,
    el('img', { src: LOGO, alt: 'Viva+ Benefícios' }),
    el('div', { class: 'who' }, el('span', null, nomeLinha), el('button', { type: 'button', class: 'linkbtn', on: { click: sair } }, 'Sair'))));
}
function baixarContrato(btn){
  ocupado(btn, true, 'Preparando…');
  api({ api: 'contratoPdf' }).then(function(r){
    ocupado(btn, false);
    if(!r.ok){ alert(r.erro || 'Contrato indisponível.'); return; }
    r.arquivos.forEach(function(f){
